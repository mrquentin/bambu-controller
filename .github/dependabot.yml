version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before upgrading (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before upgrading (supply-chain safety).
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before upgrading (supply-chain safety).
    cooldown:
      default-days: 7
