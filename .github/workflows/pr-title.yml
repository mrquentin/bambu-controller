name: PR title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which semantic-release uses to compute the next version. Enforce the
# Conventional Commits format on it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            deps
            build
            ci
            docs
            test
            chore
            revert
            style
          requireScope: false
          # Only the type prefix matters for versioning; the subject may start
          # with a capital (Dependabot writes "chore: Bump ...").
